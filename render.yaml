# Render Blueprint for StaffSync AI.
# Deploy: Render dashboard -> New -> Blueprint -> select this repo/branch.
# Render will read this file and create both services below, prompting for
# any env var marked `sync: false`.
#
# After the first deploy, if Render appends a suffix to either service's
# onrender.com subdomain (name collision), update ALLOWED_ORIGINS on the
# server and VITE_API_URL on the client to match the real URLs, then
# redeploy both services.

services:
  - type: web
    name: staffsync-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: ALLOWED_ORIGINS
        value: https://staffsync-client.onrender.com
      # Auto-generated by Render — removes the app's insecure hardcoded
      # dev fallback from the picture entirely, with no code change needed.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Must be a MongoDB Atlas URI (local Mongo doesn't support $vectorSearch).
      - key: DATABASE_URL
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-1.5-flash
      - key: MONGODB_VECTOR_INDEX
        value: document_vector_index
      - key: OCR_MIN_TEXT_LENGTH
        value: "20"
      - key: PYTHON_BIN
        value: python3

  - type: web
    name: staffsync-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://staffsync-server.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
